<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Continue</title><style>:root{color-scheme:dark}[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#eff4ff;font:16px/1.6 system-ui,sans-serif}main{width:min(440px,calc(100% - 32px));padding:38px;background:#131f33;border:1px solid #2a3954;border-radius:18px;text-align:center}h1{font-size:25px;margin:0 0 12px}p{color:#a6b6d0;overflow-wrap:anywhere}a{display:block;text-decoration:none;background:#a6b9ff;color:#0d1831;padding:12px;border-radius:9px;font-weight:700;margin-top:22px}small{color:#a6b6d0;display:block;margin-top:16px}</style></head><body><main><h1 id="title">Loading…</h1><p id="description">Reading the page configuration.</p><a id="continue" hidden rel="noopener noreferrer">Continue</a><small id="origin"></small></main><script>
'use strict';
(async()=>{const title=document.getElementById('title'),description=document.getElementById('description'),link=document.getElementById('continue');try{const input=new URLSearchParams(location.search).get('config');if(!input)throw new Error('No configuration URL was provided.');const configUrl=new URL(input,location.href);if(!['http:','https:'].includes(configUrl.protocol)||configUrl.username||configUrl.password)throw new Error('Invalid configuration URL.');const res=await fetch(configUrl.href,{credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(20000)});if(!res.ok)throw new Error('The configuration could not be loaded.');const text=await res.text();if(text.length>16384)throw new Error('The configuration is too large.');const config=JSON.parse(text);if(!config||config.version!==1||typeof config.targetUrl!=='string')throw new Error('Unsupported configuration.');const target=new URL(config.targetUrl);if(!['http:','https:'].includes(target.protocol)||target.username||target.password)throw new Error('Invalid destination.');title.textContent='Ready to continue';description.textContent='Use the link below to open the destination.';link.textContent=typeof config.label==='string'?config.label.slice(0,100):'Continue';link.href=target.href;link.hidden=false;document.getElementById('origin').textContent=target.hostname;}catch(e){title.textContent='Unable to open this link';description.textContent=e instanceof SyntaxError?'The configuration is invalid.':e.message;}})();
</script></body></html>
